# SPDX-FileCopyrightText: 2025 aas-core-testdatagen AUTHORS
#
# SPDX-License-Identifier: MIT

version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on PyPI and GitHub).
[[annotations]]
path = ["AUTHORS", "README.rst", "CHANGELOG.rst", "CONTRIBUTING.rst"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 aas-core-testdatagen AUTHORS"
SPDX-License-Identifier = "MIT"

# The golden test data is generated, compared byte-by-byte in the tests and
# shipped as release archives, and JSON can not carry a comment.
[[annotations]]
path = "dev/test_data/test_generation/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 aas-core-testdatagen AUTHORS"
SPDX-License-Identifier = "MIT"

# The meta-model transcribes the AAS
# specification: its docstrings quote
# the definitions of the classes, attributes and constraints. That text keeps
# the license of the specification, next to the MIT license of our own code.
# The specifications published by IDTA are licensed under CC BY 4.0.
[[annotations]]
path = ["dev/test_data/meta_model/v3_1.py", "dev/test_data/meta_model/v3_2.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Industrial Digital Twin Association e. V."
SPDX-License-Identifier = "CC-BY-4.0"
